name: Hoplet release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag/release to build and upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Go and Android NDK
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;29.0.13846066"
      - run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.13846066" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/29.0.13846066" >> "$GITHUB_ENV"

      - name: Configure production signing
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "KEYSTORE_BASE64 is not configured" >&2; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
          {
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > local.properties

      - name: Build signed APK and AAB
        run: |
          chmod +x gradlew scripts/build-go-lib.sh scripts/build-native-libs.sh
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Prepare stable release assets and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          echo '=== APK CANDIDATES ==='
          mapfile -t all_apks < <(find app/build/outputs/apk -type f -name '*.apk' -print | sort)
          if ((${#all_apks[@]} == 0)); then
            echo '(none)'
          else
            printf '%s\n' "${all_apks[@]}"
          fi

          # Do not rely on the filename: AGP can use different names for the
          # universal output. Inspect each APK and require native libraries for
          # every production ABI instead.
          apk_source=''
          for apk in "${all_apks[@]}"; do
            case "$apk" in
              *-debug.apk|*-androidTest.apk|*-test.apk) continue ;;
            esac
            case "/$apk/" in
              */debug/*|*/test/*|*/androidTest/*) continue ;;
            esac
            test -s "$apk" || continue

            entries="$(unzip -Z1 "$apk" 2>/dev/null || true)"
            has_arm64=0
            has_armv7=0
            has_x86_64=0
            grep -qE '^lib/arm64-v8a/[^/]+\.so$' <<<"$entries" && has_arm64=1
            grep -qE '^lib/armeabi-v7a/[^/]+\.so$' <<<"$entries" && has_armv7=1
            grep -qE '^lib/x86_64/[^/]+\.so$' <<<"$entries" && has_x86_64=1

            if ((has_arm64 && has_armv7 && has_x86_64)); then
              if [[ -n "$apk_source" ]]; then
                echo "Multiple universal release APKs were found: '$apk_source' and '$apk'" >&2
                exit 1
              fi
              apk_source="$apk"
            fi
          done

          if [[ -z "$apk_source" ]]; then
            echo "Universal release APK was not produced." >&2
            echo "Expected one non-debug/non-test APK containing lib/arm64-v8a, lib/armeabi-v7a, and lib/x86_64." >&2
            exit 1
          fi
          echo '=== SELECTED UNIVERSAL APK ==='
          echo "$apk_source"
          echo '=== ABI CHECK ==='
          echo 'arm64-v8a: PASS'
          echo 'armeabi-v7a: PASS'
          echo 'x86_64: PASS'

          aab_source="$(find app/build/outputs/bundle -type f -name '*release.aab' -print -quit)"
          test -n "$aab_source" && test -s "$aab_source"
          cp "$apk_source" dist/app-release.apk
          cp "$aab_source" dist/app-release.aab
          if find app/build/outputs -type f -name 'mapping.txt' -print -quit | grep -q .; then
            cp "$(find app/build/outputs -type f -name 'mapping.txt' -print -quit)" dist/mapping.txt
          fi

          test -f dist/app-release.apk
          test -s dist/app-release.apk
          echo '=== FINAL APK ==='
          echo 'dist/app-release.apk'
          unzip -l dist/app-release.apk | grep -qE 'lib/arm64-v8a/'
          unzip -l dist/app-release.apk | grep -qE 'lib/armeabi-v7a/'
          unzip -l dist/app-release.apk | grep -qE 'lib/x86_64/'

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n1)"
          if [[ -n "$apksigner" && -x "$apksigner" ]]; then
            "$apksigner" verify --verbose dist/app-release.apk
            echo '=== APK SIGNATURE ==='
            echo 'PASS (apksigner verify)'
          else
            echo '=== APK SIGNATURE ==='
            echo 'SKIP (apksigner is not available)'
          fi

          # Read versions from the signed APK, not from duplicated workflow strings.
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n1)"
          test -x "$aapt"
          badging="$($aapt dump badging dist/app-release.apk)"
          version_name="$(printf '%s\n' "$badging" | sed -nE "s/.*versionName='([^']+)'.*/\1/p" | head -n1)"
          version_code="$(printf '%s\n' "$badging" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" | head -n1)"
          test -n "$version_name" && test -n "$version_code"
          apk_sha="$(sha256sum dist/app-release.apk | awk '{print $1}')"
          apk_size="$(stat -c '%s' dist/app-release.apk)"
          aab_sha="$(sha256sum dist/app-release.aab | awk '{print $1}')"
          jq -n \
            --arg versionName "$version_name" \
            --argjson versionCode "$version_code" \
            --arg packageName "net.qwdtt.client" \
            --arg apk "app-release.apk" \
            --arg sha256 "$apk_sha" \
            --arg publishedAt "${{ github.event.release.published_at || '' }}" \
            --argjson size "$apk_size" \
            '{versionName:$versionName,versionCode:$versionCode,packageName:$packageName,apk:$apk,sha256:$sha256,mandatory:false,publishedAt:$publishedAt,size:$size}' \
            > dist/update.json
          {
            (cd dist && sha256sum app-release.apk app-release.aab)
            if [[ -f dist/mapping.txt ]]; then
              (cd dist && sha256sum mapping.txt)
            fi
          } > dist/checksums.txt
          echo '=== SHA256 ==='
          echo "$apk_sha"
          cat dist/update.json

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes
          assets=(dist/app-release.apk dist/app-release.aab dist/update.json dist/checksums.txt)
          if [ -f dist/mapping.txt ]; then assets+=(dist/mapping.txt); fi
          gh release upload "$TAG_NAME" "${assets[@]}" --clobber
